agv_base_bringe:
  ros__parameters:
    link_type: "eth"

    # 对外业务 Topic
    agv_control_topic: "/agv_control"
    feature_status_topic: "/Function/FeatureStatusInfo"
    vehicle_topic: "/Vehicle/VehicleData"
    odom_topic: "/odom"
    odom_frame: "odom"
    base_frame: "base_link"

    # Nav2 短期兼容：/cmd_vel → 内部 twist 语义
    cmd_vel_compat_enable: false
    cmd_vel_topic: "/cmd_vel"

    cmd_rate_hz: 50.0
    status_timeout_ms: 500
    cmd_timeout_ms: 500

    max_linear_m_s: 0.8
    max_angular_rad_s: 1.0
    cruise_scale: 1.0

    mode_req: 1
    strafe_jl_from_angular: true
    strafe_speed_m_s: 0.3
    sideways_steer_millirad: 1571
