nav_manager_node:
  ros__parameters:
    # task_fsm 对接
    nav_goal_topic: "/goal_pose"
    nav_arrived_topic: "/task/nav_arrived"

    # 传感器输入（/lidar/object 为 LaserScan）
    lidar_topic: "/lidar/object"
    object_pose_topic: "/perception/tracked_object_pose_array"
    camera_info_topic: "/camera/color/camera_info"
    odom_topic: "/odom"

    # Nav2 模式：转发目标 + 中继 Nav2 速度（需外部 Nav2 栈运行）
    use_nav2: false
    nav2_goal_topic: "/nav_goal_pose"
    nav2_cmd_vel_topic: "/cmd_vel_nav2"

    # 底盘输出
    chassis_cmd_vel_topic: "/cmd_vel"
    current_pose_topic: "/nav/current_pose"
    nav_state_topic: "/nav/state"
    publish_state: true

    # 激光安全门控
    stop_distance: 0.35
    slow_distance: 0.60
    slow_scale: 0.4
    front_angle_deg: 60.0
    min_valid_range: 0.10

    # 内置 go-to-goal（use_nav2=false 时使用）
    goal_tolerance_xy: 0.10
    goal_tolerance_yaw: 0.15
    max_linear_vel: 0.3
    max_angular_vel: 0.8
    linear_gain: 0.8
    angular_gain: 1.5
